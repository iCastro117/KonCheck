<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editar Ciudadano - KonCheck</title>
  <style>
    /* (tu CSS exactamente igual que antes) */
    /* Reset básico */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    /* Contenedor general */
    .main-container {
      display: flex;
      height: 135vh;
      width: 99vw;
      background-color: #00839a; /* Azul principal */
    }

    /* Panel izquierdo (azul) */
    .sidebar {
      width: 260px;
      background-color: #00839a;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      color: white;
    }

    /* Sección del logo */
    .logo-section {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 45px;
      height: 45px;
    }

    .app-name {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.1;
      text-shadow:  2px 2px 4px rgba(0, 0, 0, 0.7),
      -1px -1px 2px rgba(255, 255, 255, 0.2);
    }

    /* Botón "Ciudadanos" */
    .menu-button {
      background-color: white;
      color: #00839a;
      border: none;
      border-radius: 20px;
      padding: 8px 35px;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      width: fit-content;
      margin-top: 30px;
      transition: background-color 0.3s ease;
      margin-left: 70px;
    }

    .menu-button .icon {
      margin-left: -10px;
    }

    .menu-button:hover {
      background-color: #e5e5e5;
      text-shadow:  2px 2px 4px rgba(0, 0, 0, 0.7),
      -1px -1px 2px rgba(255, 255, 255, 0.2);
    }

    .logout {
      color: white;
      text-decoration: none;
      font-size: 20px;
      align-self: flex-start;
      margin-top: auto;
      transition: opacity 0.3s ease;
      margin-left: 50px;
      font-weight: 600;
    }

    .logout:hover {
      opacity: 0.8;
    }

    .content {
      flex: 1;
      background-color: white;
      border-top-left-radius: 15px;
      border-bottom-left-radius: 15px;
      margin: 20px 20px 20px 0;
      position: relative;
    }

    .profile-icon {
      position: absolute;
      top: 20px;
      right: 35px;
      font-size: 30px;
      color: black;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 95%;
      margin: 30px auto 30px auto;
    }

    .header-box {
      flex: 1;
      background-color: #00839a;
      color: #fff;
      padding: 15px 30px;
      border-radius: 20px;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 85px;
    }

    .profile-icon {
      font-size: 42px;
      color: #000;
      cursor: pointer;
      margin-top: 9px;
    }

    .search-section {
      width: 95%;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .new-btn {
      background-color: #00839a;
      color: #fff;
      border: none;
      padding: 12px 25px;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .new-btn:hover {
      background-color: #006b7f;
      transform: translateY(-2px);
    }

    .new-btn1 {
      background-color: #9a0000;
      color: #fff;
      border: none;
      padding: 12px 30px;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.3s ease, transform 0.2s ease;
      margin-left: 740px;
    }

    .new-btn1:hover {
      background-color: #7c0101;
      transform: translateY(-2px);
    }

    .section-title {
      position: relative;
      top: -35px;
      margin: -15px 0 0 40px;
      font-size: 20px;
      font-weight: 700;
      color: #000;
    }

    .section-subTitle {
      position: relative;
      top: -30px;
      margin: 30px 0 0 10px;
      font-size: 15px;
      font-weight: 600;
      color: #000;
    }

    .section-subTitle2 {
      position: relative;
      top: -30px;
      margin: 30px 0 0 5px;
      font-size: 20px;
      font-weight: 700;
      color: #000;
    }

    .registro-box {
      width: 95%;
      min-height: 140px;
      margin: 10px auto 15px auto;
      background-color: #ffffff;
      border: 1.5px solid #dcdcdc;
      border-radius: 15px;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.15);
      padding: 20px;
      transition: box-shadow 0.3s ease;
    }

    .registro-box:hover {
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
    }

    .registro-box2 {
      width: 95%;
      min-height: 520px;
      margin: 0px auto 40px auto;
      background-color: #ffffff;
      border: 1.5px solid #dcdcdc;
      border-radius: 15px;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.15);
      padding: 20px;
      transition: box-shadow 0.3s ease;
    }

    .registro-box2:hover {
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
    }

    .acciones {
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
    }

    .acciones button {
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 18px;
      transition: 0.3s;
    }

    .btn-editar {
      background: #00b050;
      color: #fff;
    }

    .btn-editar:hover {
      background: #009245;
      transform: scale(1.05);
    }

    .btn-eliminar {
      background: #d32f2f;
      color: #fff;
    }

    .btn-eliminar:hover {
      background: #b71c1c;
      transform: scale(1.05);
    }

    .tabla-ciudadanos {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      border: 2px solid #ccc;
      border-radius: 12px;
      overflow: hidden;
    }

    .tabla-ciudadanos th {
      background-color: #e0e0e0;
      color: #333;
      padding: 10px 24px;
      letter-spacing: 1px;
      text-align: left;
      border-bottom: 2px solid #ccc;
    }

    .tabla-ciudadanos td {
      padding: 8px 24px;
      border-bottom: 1px solid #ccc;
    }

    .tabla-ciudadanos tbody tr:hover {
      background-color: #f7f7f7;
    }

    .tabla-ciudadanos tbody tr:last-child td {
      border-bottom: none;
    }

    .form-actualizar {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 20px;
    }

    .form-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }

    .form-group {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-weight: 600;
      margin-bottom: 5px;
      font-size: 15px;
    }

    .form-group input,
    .estado-select {
      padding: 10px 14px;
      border: 1.5px solid #bfbfbf;
      border-radius: 10px;
      font-size: 15px;
      width: 100%;
      background-color: #fff;
      outline: none;
      transition: border 0.3s;
    }

    .form-group input:focus,
    .estado-select:focus {
      border: 1.5px solid #00839a;
    }

    .estado-select {
      appearance: none;
      cursor: pointer;
      background-color: #f7f7f7;
    }

    .estado-row {
      align-items: flex-end;
    }

    .botones {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .btn-guardar,
    .btn-cancelar {
      padding: 10px 30px;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-guardar {
      background-color: #00839a;
      color: #fff;
    }

    .btn-guardar:hover {
      background-color: #006f83;
      transform: translateY(-2px);
    }

    .btn-cancelar {
      background-color: #6e6e6e;
      color: #fff;
    }

    .btn-cancelar:hover {
      background-color: #555;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <div class="main-container">
    <div class="sidebar">
      <div>
        <div class="logo-section">
          <img src="../../Assets/LOGOINGRESAR.png" alt="KonCheck logo" class="logo" />
          <h2 class="app-name">KonCheck</h2>
        </div>

        <button class="menu-button">
          <span class="icon">🔒 </span> Ciudadanos  
        </button>
      </div>

      <a href="#" class="logout">Cerrar Sesión</a>
    </div>

    <div class="content">
      <div class="top-bar">
        <div class="header-box">
          Gestión de Ciudadanos
        </div>
        <div class="profile-icon">👤</div>
      </div>

      <div class="search-section">
        <button class="new-btn1">📄 Generar Reporte </button>
        <button class="new-btn">Nuevo Ciudadano</button>
      </div>

      <h2 class="section-title">Registro de Ciudadanos</h2>

      <div class="registro-box">
        <h3 class="section-subTitle">Ciudadano a Actualizar</h3>
      </div>

      <div class="registro-box2">
        <h3 class="section-subTitle2">Datos a Actualizar</h3>

        <form class="form-actualizar">
          <div class="form-row">
            <div class="form-group">
              <label>Identificación</label>
              <input type="text" name="identificacion" placeholder="1.088.765.432" />
            </div>
            <div class="form-group">
              <label>Nombres</label>
              <input type="text" name="nombres" placeholder="Juan" />
            </div>
            <div class="form-group">
              <label>Apellidos</label>
              <input type="text" name="apellidos" placeholder="Perez" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Fecha de nacimiento</label>
              <input type="date" name="fechaNacimiento" />
            </div>
            <div class="form-group">
              <label>Lugar de nacimiento</label>
              <input type="text" name="lugarNacimiento" placeholder="Bogotá" />
            </div>
            <div class="form-group">
              <label>RH</label>
              <input type="text" name="rh" placeholder="O+" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Fecha de expedición</label>
              <input type="date" name="fechaExpedicion" />
            </div>
            <div class="form-group">
              <label>Lugar de expedición</label>
              <input type="text" name="lugarExpedicion" placeholder="Bogotá" />
            </div>
            <div class="form-group">
              <label>Estatura (m)</label>
              <input type="text" name="estatura" placeholder="1.86" />
            </div>
          </div>

          <div class="form-row estado-row">
            <div class="form-group">
              <label>Estado</label>
              <select name="estado" class="estado-select">
                <option value="No Requerido">🟢 No Requerido</option>
                <option value="Requerido">🔴 Requerido</option>
              </select>
            </div>

            <div class="botones">
              <button type="submit" class="btn-guardar">Guardar</button>
              <button type="button" class="btn-cancelar">Cancelar</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  // Obtener ciudadano seleccionado
  const ciudadanoData = localStorage.getItem("ciudadanoSeleccionado");

  if (ciudadanoData) {
    const c = JSON.parse(ciudadanoData);
    const registroBox = document.querySelector('.registro-box');
    if (registroBox) {
      registroBox.innerHTML = `
        <h3 class="section-subTitle">Ciudadano a Actualizar</h3>
        <table class="tabla-ciudadanos">
          <thead>
            <tr>
              <th>Identificación</th>
              <th>Nombres</th>
              <th>Apellidos</th>
              <th>Fecha Nacimiento</th>
              <th>Lugar Nacimiento</th>
              <th>Estado Judicial</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>${c.identificacion}</td>
              <td>${c.nombres}</td>
              <td>${c.apellidos}</td>
              <td>${c.fechaNacimiento}</td>
              <td>${c.lugarNacimiento}</td>
              <td>${c.estadoJudicial}</td>
              <td class="acciones">
                <button class="btn-eliminar">🗑️</button>
              </td>
            </tr>
          </tbody>
        </table>
      `;
    }

    // Autocompletar campos del formulario
    const setIf = (sel, val) => {
      const el = document.querySelector(sel);
      if (el) el.value = val || "";
    };
    setIf('input[name="identificacion"]', c.identificacion);
    setIf('input[name="nombres"]', c.nombres);
    setIf('input[name="apellidos"]', c.apellidos);
    setIf('input[name="fechaNacimiento"]', c.fechaNacimiento);
    setIf('input[name="lugarNacimiento"]', c.lugarNacimiento);
    setIf('input[name="rh"]', c.rh);
    setIf('input[name="fechaExpedicion"]', c.fechaExpedicion);
    setIf('input[name="lugarExpedicion"]', c.lugarExpedicion);
    setIf('input[name="estatura"]', c.estatura);
    const selEstado = document.querySelector('select[name="estado"]');
    if (selEstado) selEstado.value = c.estadoJudicial || "No Requerido";
  }

  // Botón "Nuevo Ciudadano"
  const newBtn = document.querySelector('.new-btn');
  if (newBtn) {
    newBtn.addEventListener('click', () => {
      window.location.href = 'crearCiudadano.html';
    });
  }

  const form = document.querySelector(".form-actualizar");
  const cancelarBtn = document.querySelector(".btn-cancelar");

  // FUNCIÓN: muestra overlay con iframe (no redirige)
  function mostrarOverlayIframe(rutaRelativa) {
    // cerrar overlay previo si existe
    const prev = document.querySelector('.prompt-overlay');
    if (prev) prev.remove();

    const overlay = document.createElement('div');
    overlay.className = 'prompt-overlay';
    Object.assign(overlay.style, {
      position: 'fixed',
      inset: '0',
      display: 'flex',
      alignItems: 'center',
      justifyContent: 'center',
      background: 'rgba(0,0,0,0.55)',
      zIndex: 99999,
      padding: '20px'
    });

    const caja = document.createElement('div');
    Object.assign(caja.style, {
      position: 'relative',
      width: '720px',
      maxWidth: '95vw',
      height: '70vh',
      maxHeight: '90vh',
      borderRadius: '12px',
      overflow: 'hidden',
      boxShadow: '0 8px 30px rgba(0,0,0,0.4)',
      background: '#fff'
    });

    const closeBtn = document.createElement('button');
    closeBtn.innerHTML = '&times;';
    Object.assign(closeBtn.style, {
      position: 'absolute',
      top: '10px',
      right: '12px',
      zIndex: 10,
      fontSize: '28px',
      background: 'transparent',
      border: 'none',
      cursor: 'pointer',
      color: '#333'
    });

    // Si la ruta es la de operacionExitosa, marcamos el overlay para ir al dashboard al cerrarlo
    if (typeof rutaRelativa === 'string' && rutaRelativa.toLowerCase().includes('operacionexitosa')) {
      overlay.dataset.goto = 'dashboard.html';
    } else {
      // limpiar por si acaso
      delete overlay.dataset.goto;
    }

    closeBtn.addEventListener('click', () => {
      const goto = overlay.dataset.goto;
      overlay.remove();
      if (goto) {
        // ir al dashboard si corresponde
        window.location.href = goto;
      }
    });

    const iframe = document.createElement('iframe');
    iframe.src = rutaRelativa;
    Object.assign(iframe.style, {
      width: '100%',
      height: '100%',
      border: '0',
      display: 'block'
    });

    overlay.addEventListener('click', (ev) => {
      if (ev.target === overlay) {
        const goto = overlay.dataset.goto;
        overlay.remove();
        if (goto) {
          window.location.href = goto;
        }
      }
    });

    caja.appendChild(closeBtn);
    caja.appendChild(iframe);
    overlay.appendChild(caja);
    document.body.appendChild(overlay);
  }

  // ===== LISTENER: recibe mensajes desde los prompts cargados en el iframe =====
  window.addEventListener('message', (ev) => {
    try {
      const msg = ev.data;
      if (!msg || typeof msg !== 'object') return;
      console.log('editarCiudadano: mensaje recibido desde iframe ->', msg);

      if (msg.action === 'closePrompt') {
        const ov = document.querySelector('.prompt-overlay');
        if (ov) ov.remove();
        // volver a enfocar el primer campo del form
        const first = document.querySelector('input[name="identificacion"]');
        if (first) first.focus();
        return;
      }

      if (msg.action === 'showPrompt' && msg.ruta) {
        // reemplazar overlay actual por el prompt indicado
        const existing = document.querySelector('.prompt-overlay');
        if (existing) existing.remove();

        // Si el prompt que piden mostrar es operacionExitosa, marcamos que al cerrar debe ir al dashboard
        mostrarOverlayIframe(msg.ruta);
        return;
      }

      // soporte adicional: si el iframe pide explícitamente "goDashboard"
      if (msg.action === 'goDashboard') {
        const ov = document.querySelector('.prompt-overlay');
        if (ov) ov.remove();
        window.location.href = 'dashboard.html';
        return;
      }

    } catch (err) {
      console.error('Error procesando mensaje desde iframe:', err);
    }
  });

  // CANCELAR: ahora con ruta relativa correcta (PROMPTS está dentro de Dashboard)
  if (cancelarBtn) {
    cancelarBtn.addEventListener('click', (e) => {
      e.preventDefault();
      mostrarOverlayIframe('PROMPTS/cancelarOperacion.html');
    });
  }

  // GUARDAR: actualiza storage y muestra overlay de operación exitosa (ruta relativa correcta)
  if (form) {
    form.addEventListener('submit', (e) => {
      e.preventDefault();

      try {
        const lista = JSON.parse(localStorage.getItem("ciudadanos")) || [];
        const seleccionado = JSON.parse(localStorage.getItem("ciudadanoSeleccionado"));

        if (!seleccionado) {
          alert("No hay ciudadano seleccionado para actualizar.");
          return;
        }

        const index = lista.findIndex(
          (it) => it.identificacion.replace(/\./g, "") === seleccionado.identificacion.replace(/\./g, "")
        );

        if (index === -1) {
          alert("El ciudadano seleccionado no existe en la lista, verifica los datos.");
          return;
        }

        const ciudadanoActualizado = {
          identificacion: form.identificacion.value,
          nombres: form.nombres.value,
          apellidos: form.apellidos.value,
          fechaNacimiento: form.fechaNacimiento.value,
          lugarNacimiento: form.lugarNacimiento.value,
          rh: form.rh.value,
          fechaExpedicion: form.fechaExpedicion.value,
          lugarExpedicion: form.lugarExpedicion.value,
          estatura: form.estatura.value,
          estadoJudicial: form.estado.value
        };

        lista[index] = ciudadanoActualizado;
        localStorage.setItem("ciudadanos", JSON.stringify(lista));
        localStorage.setItem("ciudadanoSeleccionado", JSON.stringify(ciudadanoActualizado));

        // Abrir overlay de operación exitosa (al cerrarlo se redirigirá a dashboard.html)
        mostrarOverlayIframe('PROMPTS/operacionExitosa.html');
      } catch (err) {
        console.error('Error al guardar:', err);
        alert('Ocurrió un error al guardar. Revisa la consola.');
      }
    });
  }
});
</script>

</body>
</html>
